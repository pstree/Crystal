name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    # The Client/Server projects target net8.0-windows and use WinForms.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Show SDK info
        run: dotnet --info

      # PatcherWebSite is a legacy .NET Framework 4.8 website project that
      # `dotnet build` cannot handle, so the solution is not built as a whole.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            "Controls/FixedListViewControl/CustomFormControl.csproj"
            "Shared/Shared.csproj"
            "Server/Server.Library.csproj"
            "Server.MirForms/Server.csproj"
            "Client/Client.csproj"
            "LibraryEditor/LibraryEditor.csproj"
            "LibraryViewer/LibraryViewer.csproj"
            "AutoPatcherAdminV2/AutoPatcherAdminV2.csproj"
            "Tests/ItemSecurity/ItemSecurity.csproj"
          )
          for project in "${projects[@]}"; do
            echo "::group::build $project"
            dotnet build "$project" -c "${{ matrix.configuration }}" --nologo
            echo "::endgroup::"
          done

      - name: Upload build output
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: crystal-release
          # Client/Server/Tools write to Build/ via <BaseOutputPath>.
          path: |
            Build/**
            AutoPatcherAdminV2/bin/${{ matrix.configuration }}/**
          if-no-files-found: warn
          retention-days: 7
